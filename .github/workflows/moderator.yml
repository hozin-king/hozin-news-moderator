name: News Moderator

# Moderasi otomatis tiap 15 menit: sapu berita terbaru dari kata/frasa terlarang
# (pornografi, judi online, kata kasar, umpan phishing).
# Item yang kena langsung dihapus via /api/ingest/moderate memakai AISTUDIO_CRON_SECRET.

on:
  schedule:
    - cron: '*/1 * * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  moderate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install deps
        run: pip install requests

      - name: Jalankan moderasi
        env:
          AISTUDIO_CRON_SECRET: ${{ secrets.AISTUDIO_CRON_SECRET }}
        run: python moderate.py
